<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div class="main">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <a></a>


    <div class="sub">

    </div>

    <h6 style="visibility: hidden;">Hii</h6>

    <script>

        const main = document.querySelector(".main");
        console.log(main.childNodes);

        const box = document.querySelectorAll(".box");

        let i = 1;
        box.forEach(b => {
            b.innerHTML = `<p>Box${i}</p>`
            i++;
        })

        const a = document.querySelector("a");
        a.textContent = "CLick";

        a.href = "https://www.google.com/"
        a.target = "_blank"

        const sub = document.querySelector(".sub");
        
        for (let i=0; i<5; i++) {
            const b = document.createElement("div");
            b.textContent = `Sub ${i}`;
            sub.append(b);
        }

        const img = document.createElement("img");
        img.src = "https://www.lpu.in/authenticate/lpu%20logo.png";
        img.height = "200";
        img.width = "200";
        img.alt = "LPU";
        document.body.append(img);


        console.log(document.querySelector("h6").textContent); //Returns all text including hidden

        
    </script>
    
</body>
</html>

<!-- DOM -> It is a tree like structure containing nodes  -->
 <!-- innerText -> It returns visible text only. -->
  <!-- textContent -> It returns all texts including hidden -->
