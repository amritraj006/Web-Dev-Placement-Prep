<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Unordered list -->
    <ul type="disc">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
    <!-- Type can be "disc", "circle", "square", or "none" -->

    <!-- Ordered list -->
     <ol type="1">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
     </ol>
     <!-- Type can be "1", "a", "A", "i", or "I" -->

     <!-- Description list -->
     <dl>
         <dt>Term 1</dt>
         <dd>Description 1</dd>
         <dt>Term 2</dt>
         <dd>Description 2</dd>
     </dl>
     <!-- dl -> Description List, dt -> Description Term, dd -> Description Description -->

</body>
</html>
