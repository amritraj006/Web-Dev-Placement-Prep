<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>
<body>

<h2>Student Registration Form</h2>

<form action="/register" method="post">

    <label for="name">Name:</label>
    <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your name"
        required
    >

    <br><br>

    <label for="email">Email:</label>
    <input
        type="email"
        id="email"
        name="email"
        required
    >

    <br><br>

    <label>Password:</label>
    <input
        type="password"
        name="password"
        minlength="8"
        max
        required
    >

    <br><br>

    <label>Gender:</label>

    <input
        type="radio"
        name="gender"
        value="Male"
        
    > Male

    <input
        type="radio"
        name="gender"
        value="Female"
    > Female

    <br><br>

    <label>Skills:</label>

    <input type="checkbox" name="skill" value="HTML"> HTML

    <input type="checkbox" name="skill" value="CSS"> CSS

    <input type="checkbox" name="skill" value="JavaScript"> JavaScript

    <br><br>

    <label>Country:</label>

    <select name="country">

        <option>India</option>

        <option>USA</option>

        <option>Canada</option>

    </select>

    <br><br>

    <label>About You:</label>

    <textarea
        rows="5"
        cols="30"
        name="about"
    ></textarea>

    <br><br>

    <button type="submit">
        Register
    </button>

    <button type="reset">
        Reset
    </button>

</form>

</body>
</html>

<!-- action attribute specifies where to send the form data when the form is submitted -->
 <!-- method attribute specifies how to send the form data (GET or POST) -->
  <!-- label -> Provides a label for the form element -->
   <!-- for -> it connects the label with the input matching with the id -->
    <!-- name attribute used in server-side programming it tells server that what kind of data is being sent or we can say the key or field name of the input that we are submitting -->
