<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1" cellpadding="10" cellspacing="20" width="50%" height="50%" align="center" bgcolor="#f2f2f2">
        <caption>This is a table</caption>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
            </tr>
            <tr>
                <th>H</th>
                <th>A</th>
            </tr>
        </thead>
        <tbody>
            <tr align="center">
                <td>John</td>
                <td>25</td>
            </tr>
            <tr align="center">
                <td>Jane</td>
                <td>30</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td align="center" colspan="2">This is the footer</td>
            </tr>
        </tfoot>
    </table>

    <!-- tr -> table row, th -> table header, td -> table data -->
     <!-- cellpadding -> adds space around table cells -->
      <!-- cellspacing -> adds space between table cells -->
       <!-- width, height, align -> center , bgcolor -->
        <!-- colspan -> One cell occupies multiple columns -->
         <!-- rowspan -> One cell occupies multiple rows -->
        <!-- thead -> Groups header content in a table -->
         <!-- tbody -> Groups body content in a table -->
         <!-- tfoot -> Groups footer content in a table -->
          <!-- Caption -> Provides a title for the table -->
</body>
</html>
