<!DOCTYPE html> 
<!-- DOCTYPE html tells browser that this website is written in HTML5 -->
<html lang="en"> 
    <!-- This is the root element of the HTML document  lang = "en" states that this page is in English -->
<head>
    <meta charset="UTF-8">
    <!-- This meta tag specifies the character encoding for the HTML document -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- This meta tag specifies the viewport for the HTML document, The viewport is the area visible on the web page -->
     <!-- width=device-width -> It sets the width of the viewport to the width of the device  -->
      <!-- Initial Scale -> It sets the initial zoom level of the webpage to 100% -->
    <title>Document</title>
</head>
<body>
    <h1>Hello, Worlld</h1>
    <ol type="i">
        <!-- Type can be 1,a,A,i,I -->
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ol>

    <b>Hii</b>     <!-- Bold text -->
    <strong>Hii</strong> <!-- Bold text, This is more semantically correct -->
    <i>Hii</i> <!-- Italic text -->
    <em>Hii</em> <!-- Italic text -->
    <u>Hii</u> <!-- Underlined text -->
    <mark>Hii</mark> <!-- Highlighted text -->
    <sup>Hii</sup> <!-- Superscript text -->
    <sub>Hii</sub> <!-- Subscript text -->
    <small>Hii</small> <!-- Small text -->

    <a target="_self" href="https://www.google.com">Visit Google</a>
    <!-- Target="_self" (default) opens the link in the same window -->
     <!-- Target="_blank" opens the link in a new window or tab -->
      

    <img src="image.jpg" width="500" height="100" alt="Description of image">
    <!-- img tag does not require a closing tag -->
    <!-- If image is not visible, the alt text will be displayed -->

    
</body>
</html>
